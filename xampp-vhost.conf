
# Sistema 3LD - Desarrollo Local
<VirtualHost *:80>
    ServerName sistema3ld.local
    DocumentRoot "C:/Proyectos/sistema3ld/frontend/dist"
    <Directory "C:/Proyectos/sistema3ld/frontend/dist">
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    Alias /api "C:/Proyectos/sistema3ld/backend/public"
    <Directory "C:/Proyectos/sistema3ld/backend/public">
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
</VirtualHost>
